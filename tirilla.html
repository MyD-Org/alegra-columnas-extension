<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tirilla</title>
    <style>
      /* Rollo de 80 mm: el área imprimible real es ~72 mm. */
      @page { size: 80mm auto; margin: 0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #e5e7eb; color: #000; }
      body { font: 11px/1.3 "Helvetica Neue", Arial, sans-serif; }
      .barra { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; justify-content: center; padding: 10px; background: #1e293b; color: #fff; font-size: 13px; }
      .barra button { font: inherit; padding: 6px 14px; border: 0; border-radius: 6px; background: #30aba9; color: #fff; cursor: pointer; }
      .barra button.sec { background: transparent; border: 1px solid #64748b; }
      #mensaje { max-width: 420px; margin: 40px auto; padding: 16px; background: #fff; border-radius: 8px; font-size: 14px; line-height: 1.5; }
      #mensaje button { margin: 6px 6px 0 0; font: inherit; padding: 6px 12px; cursor: pointer; }
      #ticket { width: 72mm; margin: 16px auto; padding: 3mm 1mm 6mm; background: #fff; }
      @media print {
        html, body { background: #fff; }
        .barra, #mensaje { display: none !important; }
        #ticket { margin: 0 auto; padding-top: 0; }
      }
      .c { text-align: center; }
      .r { text-align: right; }
      .b { font-weight: 700; }
      .chico { font-size: 9.5px; }
      .grande { font-size: 14px; }
      .sep { border-top: 1px dashed #000; margin: 5px 0; }
      .logo { display: block; max-width: 60mm; max-height: 22mm; margin: 0 auto 4px; }
      .letra { display: inline-block; border: 1.5px solid #000; padding: 1px 8px; font-size: 20px; font-weight: 700; line-height: 1.1; }
      .fila { display: flex; justify-content: space-between; gap: 6px; }
      .fila > :last-child { text-align: right; white-space: nowrap; }
      .item { margin-bottom: 3px; }
      .item .desc { word-break: break-word; }
      .qr { display: block; width: 32mm; height: 32mm; margin: 4px auto 2px; }
      .qr svg { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div class="barra" id="barra" hidden>
      <span id="titulo"></span>
      <button id="imprimir" type="button">Imprimir</button>
      <button id="cerrar" type="button" class="sec">Cerrar</button>
    </div>
    <div id="mensaje">Cargando la factura…</div>
    <div id="ticket" hidden></div>
    <script src="vendor/qrcode.js"></script>
    <script src="cuentas.js"></script>
    <script src="tirilla.js"></script>
  </body>
</html>
